services:
  - type: web
    name: be-unavailability-backend
    runtime: python
    rootDir: app/backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: web
    name: be-unavailability-frontend
    runtime: static
    rootDir: app/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: app/frontend/dist
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: be-unavailability-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
